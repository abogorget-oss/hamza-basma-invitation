<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دعوة زفاف | حمزة & بسمة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background-glow"></div>

<section class="hero">

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="title">

        <p class="basmala">
            بسم الله الرحمن الرحيم
        </p>

        <h1>
            حمزة <span>&</span> بسمة
        </h1>

        <p class="subtitle">
            Wedding Invitation
        </p>

    </div>

    <div class="envelope-area">

        <div class="envelope" id="envelope">

            <div class="envelope-back"></div>

            <div class="letter">

                <h2>يشرفنا حضوركم</h2>

                <h3>حفل زفاف</h3>

                <h1>حمزة & بسمة</h1>

                <div class="info">

                    <div>
                        📅
                        <span>السبت</span>
                        <small>24 مايو 2025</small>
                    </div>

                    <div>
                        🕢
                        <span>7:30 مساءً</span>
                    </div>

                    <div>
                        📍
                        <span>قاعة أمنية</span>
                        <small>الحاووز الثاني - الخليل</small>
                    </div>

                </div>

                <a class="location-btn" href="#" target="_blank">
                    الموقع على الخريطة
                </a>

            </div>

            <div class="flap" id="flap"></div>

            <div class="seal" id="seal">
                H&B
            </div>

        </div>

    </div>

    <p class="hint">
        اضغط على الختم لفتح الدعوة
    </p>

</section>

<div class="petals"></div>

<script src="script.js"></script>

</body>

</html>
